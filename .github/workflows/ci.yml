name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-26
            platforms;android-36
            build-tools;36.1.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/**', 'android/**/build.gradle.kts', 'android/settings.gradle.kts') }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Gate visual (STATUS-MAP §4b). Bukan best-effort: tanpa
      # `continue-on-error`, langkah ini menggagalkan job `test`, dan job itu
      # wajib jadi required status check di branch protection `main` —
      # kegagalan gate memblokir merge.
      # Golden direkam manual (`./gradlew recordRoborazziDebug`), tidak di CI.
      - name: Verify widget snapshots (blocking gate)
        run: ./gradlew :app:verifyRoborazziDebug --stacktrace

      - name: Upload snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diff
          path: |
            android/app/build/outputs/roborazzi
            android/app/src/test/snapshots
          if-no-files-found: ignore

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dot-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
