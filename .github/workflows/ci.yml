name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Token drift gate (design/tokens.json → Color.kt)
        working-directory: ${{ github.workspace }}
        run: |
          python3 design/generate_color_kt.py
          git diff --exit-code -- android/app/src/main/java/io/github/areifzyp/dot/ui/theme/Color.kt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-26
            platforms;android-36
            build-tools;36.1.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/**', 'android/**/build.gradle.kts', 'android/settings.gradle.kts') }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
